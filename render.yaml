services:
  - type: web
    name: timber-tackle-supply
    runtime: node
    plan: starter
    region: ohio
    buildCommand: node --check server.js && node --check admin.js && node --check app.js && node --check install.js && node --check legal.js
    startCommand: node server.js
    healthCheckPath: /api/session
    disk:
      name: timber-tackle-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_DATA_DIR
        value: /var/data
      - key: OWNER_SETUP_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_SHIPPING_CENTS
        value: "0"
      - key: STORE_LEGAL_NAME
        sync: false
      - key: STORE_SUPPORT_EMAIL
        sync: false
      - key: STORE_POSTAL_ADDRESS
        sync: false
      - key: STORE_SHIPPING_POLICY
        sync: false
      - key: STORE_RETURNS_POLICY
        sync: false
      - key: STORE_TAX_DISCLOSURE
        sync: false
      - key: STORE_POLICY_EFFECTIVE_DATE
        sync: false
      - key: STORE_LIVE_COMPLIANCE_CONFIRMED
        value: "false"
